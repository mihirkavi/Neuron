<!doctype html>
<html><head><meta charset="utf-8">
<title>Neuron banner</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Neuron identity: site blueprint. Brand colors from the live site's :root and the logo. */
:root{
  --paper:#f5f6fb; --ink:#111827; --muted:#4b5563; --line:rgba(99,102,241,.16); --line2:rgba(99,102,241,.38);
  --indigo:#6366f1; --indigo-d:#4f46e5; --emerald:#10b981; --chip:#ffffff; --plan:#1f2937;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#0e1324; --ink:#f3f4f6; --muted:#a5adbd; --line:rgba(129,140,248,.13); --line2:rgba(129,140,248,.42);
  --indigo:#818cf8; --indigo-d:#a5b4fc; --emerald:#34d399; --chip:#151c33; --plan:#c7cdf5;
}}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:600px;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:Inter,sans-serif;position:relative;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px),
  linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px;background-position:-1px -1px;}
body::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--paper) 0%,var(--paper) 44%,transparent 62%);opacity:.92}
.left{position:absolute;left:96px;top:0;bottom:0;width:780px;display:flex;flex-direction:column;justify-content:center;z-index:2}
.brand{display:flex;align-items:center;gap:16px;margin-bottom:34px}
.brand b{font-family:Archivo;font-weight:800;font-stretch:112%;font-size:30px;letter-spacing:-.01em}
.brand span{font-family:'IBM Plex Mono';font-size:15px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;border-left:1.5px solid var(--line2);padding-left:16px}
h1{font-family:Archivo;font-weight:850;font-stretch:118%;font-size:104px;line-height:.96;letter-spacing:-.035em}
h1 em{font-style:normal;color:var(--indigo)}
h1 em i{font-style:normal;color:var(--emerald)}
p{margin-top:28px;font-size:25px;line-height:1.42;color:var(--muted);max-width:690px}
.tags{display:flex;gap:10px;margin-top:32px}
.tags span{font-family:'IBM Plex Mono';font-size:15px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;padding:9px 14px;border:1.5px solid var(--line2);background:var(--chip);color:var(--ink)}
.tags span:first-child{border-color:var(--emerald);color:var(--emerald)}
svg.plan{position:absolute;right:40px;top:30px;width:720px;height:540px;z-index:1}
.plan text{font-family:'IBM Plex Mono';font-size:13px;letter-spacing:.08em;fill:var(--muted)}
.plan .lbl{font-size:14px;font-weight:600;fill:var(--ink)}
</style></head>
<body>
<div class="left">
  <div class="brand">
    <svg width="44" height="44" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M12 82V20L76 82" fill="none" stroke="var(--indigo)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M76 20V70" stroke="var(--emerald)" stroke-width="13" stroke-linecap="round"/>
      <circle cx="12" cy="20" r="14" fill="var(--indigo)"/><circle cx="76" cy="20" r="14" fill="var(--emerald)"/><circle cx="76" cy="82" r="14" fill="var(--indigo)"/>
    </svg>
    <b>Neuron</b><span>by OmniSense</span>
  </div>
  <h1>Every jobsite,<br><em>sensed<i>.</i></em></h1>
  <p>A venture concept for one solar-powered sensor node that turns site activity into time, staffing and cost insight.</p>
  <div class="tags"><span>Concept · not built</span><span>Construction</span><span>IoT</span><span>USC InnovateLA</span></div>
</div>

<svg class="plan" viewBox="0 0 720 540" aria-hidden="true">
  <!-- site plan outline -->
  <g fill="none" stroke="var(--plan)" stroke-width="2.5" opacity=".85">
    <path d="M90 70H640V440H360V380H90Z"/>
    <path d="M90 230H250V380" /><path d="M420 70V200H640"/><path d="M250 230V170" />
    <path d="M420 390H520V440" stroke-dasharray="7 6"/>
  </g>
  <!-- dimension lines -->
  <g stroke="var(--indigo)" stroke-width="1.4" fill="var(--indigo)">
    <path d="M90 40H640"/><path d="M90 32V48M640 32V48"/>
    <path d="M672 70V440"/><path d="M664 70H680M664 440H680"/>
  </g>
  <text x="330" y="30" text-anchor="middle">SITE PLAN · COVERAGE (ILLUSTRATIVE)</text>
  <!-- coverage rings -->
  <g fill="none" stroke="var(--emerald)">
    <circle cx="335" cy="255" r="70" stroke-width="2" opacity=".75"/>
    <circle cx="335" cy="255" r="130" stroke-width="1.6" opacity=".5" stroke-dasharray="3 7"/>
    <circle cx="335" cy="255" r="195" stroke-width="1.4" opacity=".32" stroke-dasharray="3 9"/>
  </g>
  <!-- node -->
  <circle cx="335" cy="255" r="26" fill="var(--indigo)"/>
  <circle cx="335" cy="255" r="10" fill="var(--paper)"/>
  <!-- callouts -->
  <g stroke="var(--line2)" stroke-width="1.5" fill="none">
    <path d="M355 236L450 140H560"/><path d="M315 236L210 130H110"/>
    <path d="M358 270L470 352H590"/><path d="M312 272L200 330H110"/>
  </g>
  <g fill="var(--emerald)"><circle cx="560" cy="140" r="5"/><circle cx="110" cy="130" r="5"/><circle cx="590" cy="352" r="5"/><circle cx="110" cy="330" r="5"/></g>
  <text class="lbl" x="462" y="128">CAMERA · VISION</text>
  <text class="lbl" x="112" y="118">ENVIRONMENT</text>
  <text class="lbl" x="478" y="340">MOTION · ACCESS</text>
  <text class="lbl" x="112" y="318">AUDIO</text>
  <text x="335" y="352" text-anchor="middle">NODE-01 · SOLAR</text>
  <!-- title block -->
  <g transform="translate(420 470)">
    <rect width="250" height="54" fill="var(--chip)" stroke="var(--plan)" stroke-width="1.5"/>
    <path d="M0 27H250M120 0V54" stroke="var(--plan)" stroke-width="1"/>
    <text x="10" y="19">DWG</text><text class="lbl" x="10" y="45">NEURON-01</text>
    <text x="130" y="19">STATUS</text><text class="lbl" x="130" y="45" style="fill:var(--emerald)">CONCEPT</text>
  </g>
</svg>
</body></html>
